name: iVolume
options:
  bundleIdPrefix: com.antonioconopio
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  iVolume:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Sources/iVolume
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: iVolume
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright (c) 2026"
        NSAudioCaptureUsageDescription: "iVolume uses this permission to read and adjust the playback volume of individual apps."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioconopio.iVolume
        PRODUCT_NAME: iVolume
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
